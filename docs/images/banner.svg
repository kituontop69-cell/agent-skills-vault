<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0F0F16" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#E8CA89" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.02)" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="480" fill="url(#bg)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="0" y1="360" x2="1200" y2="360" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="150" y1="0" x2="150" y2="480" />
    <line x1="300" y1="0" x2="300" y2="480" />
    <line x1="450" y1="0" x2="450" y2="480" />
    <line x1="600" y1="0" x2="600" y2="480" />
    <line x1="750" y1="0" x2="750" y2="480" />
    <line x1="900" y1="0" x2="900" y2="480" />
    <line x1="1050" y1="0" x2="1050" y2="480" />
  </g>

  <!-- Ambient Golden Glow -->
  <circle cx="600" cy="140" r="180" fill="#C5A880" opacity="0.08" filter="url(#glow)" />

  <!-- Badge Pill -->
  <g transform="translate(460, 45)">
    <rect width="280" height="32" rx="16" fill="rgba(197, 168, 128, 0.12)" stroke="#C5A880" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#10B981" />
    <text x="34" y="21" fill="#DFBA73" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" letter-spacing="2">713+ AGENT SKILLS ARCHIVE</text>
  </g>

  <!-- Title -->
  <text x="600" y="130" text-anchor="middle" fill="#FFFFFF" font-family="'Times New Roman', Georgia, serif" font-size="44" font-weight="400" letter-spacing="1">
    AGENT <tspan fill="url(#gold)" font-style="italic">SKILLS VAULT</tspan>
  </text>
  <text x="600" y="165" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="300" letter-spacing="0.5">
    The Definitive Autonomous AI Agent Execution Library for Antigravity, Claude Code, Cline &amp; OpenCode
  </text>

  <!-- Category Architecture Pillars -->
  <!-- Pillar 1: AI & Agentic OS -->
  <g transform="translate(60, 220)">
    <rect width="250" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="250" height="3" rx="1.5" fill="url(#gold)" />
    <text x="24" y="38" fill="#DFBA73" font-family="monospace" font-size="11" letter-spacing="1">01 // ORCHESTRATION</text>
    <text x="24" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600">Autonomous Loops</text>
    <text x="24" y="92" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Agent Harness Construction</text>
    <text x="24" y="114" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Eval-first Dynamic Workflow</text>
    <text x="24" y="136" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Agent Introspection &amp; Recovery</text>
    <text x="24" y="164" fill="#C5A880" font-family="monospace" font-size="11">120+ Core Skills</text>
  </g>

  <!-- Pillar 2: Systems & Full-Stack -->
  <g transform="translate(340, 220)">
    <rect width="250" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="250" height="3" rx="1.5" fill="url(#gold)" />
    <text x="24" y="38" fill="#DFBA73" font-family="monospace" font-size="11" letter-spacing="1">02 // SYSTEMS &amp; STACK</text>
    <text x="24" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600">Native Engineering</text>
    <text x="24" y="92" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Rust, C++, Tauri v2, Win32</text>
    <text x="24" y="114" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· React 19, Next.js, Web Audio</text>
    <text x="24" y="136" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· High-Throughput Pipelines</text>
    <text x="24" y="164" fill="#C5A880" font-family="monospace" font-size="11">190+ Language Skills</text>
  </g>

  <!-- Pillar 3: Security & Tradecraft -->
  <g transform="translate(620, 220)">
    <rect width="250" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="250" height="3" rx="1.5" fill="url(#gold)" />
    <text x="24" y="38" fill="#DFBA73" font-family="monospace" font-size="11" letter-spacing="1">03 // TRADECRAFT</text>
    <text x="24" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600">Security &amp; Hardening</text>
    <text x="24" y="92" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Security Bounty Hunter</text>
    <text x="24" y="114" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Django, Perl, Node Audit</text>
    <text x="24" y="136" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Nonce CSP, Token Hardening</text>
    <text x="24" y="164" fill="#C5A880" font-family="monospace" font-size="11">85+ Audit Skills</text>
  </g>

  <!-- Pillar 4: Cloud & Mobile Tools -->
  <g transform="translate(900, 220)">
    <rect width="240" height="190" rx="14" fill="url(#cardGrad)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="240" height="3" rx="1.5" fill="url(#gold)" />
    <text x="24" y="38" fill="#DFBA73" font-family="monospace" font-size="11" letter-spacing="1">04 // CLOUD &amp; MOBILE</text>
    <text x="24" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="17" font-weight="600">Cloud &amp; SDK Hub</text>
    <text x="24" y="92" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Android CLI &amp; Flutter Dev</text>
    <text x="24" y="114" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Google Cloud, BigQuery, Run</text>
    <text x="24" y="136" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="12" font-weight="300">· Firebase &amp; Bio-Computational</text>
    <text x="24" y="164" fill="#C5A880" font-family="monospace" font-size="11">310+ Platform Skills</text>
  </g>

  <!-- Footer Credit Line -->
  <text x="600" y="450" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="11" letter-spacing="1">
    CURATED &amp; ENGINEERED BY KAUSHIK BORUAH (@KITUONTOP69-CELL) · OPEN SOURCE MIT
  </text>
</svg>
