<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="gold2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#F3DC9D" />
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.05)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.015)" />
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="720" fill="url(#bg2)" />

  <!-- Subtle grid lines -->
  <g opacity="0.06" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="200" x2="1200" y2="200" />
    <line x1="0" y1="440" x2="1200" y2="440" />
    <line x1="0" y1="680" x2="1200" y2="680" />
  </g>

  <!-- Ambient light -->
  <circle cx="600" cy="80" r="140" fill="#C5A880" opacity="0.1" filter="url(#glow2)" />

  <!-- Header Badge -->
  <g transform="translate(470, 30)">
    <rect width="260" height="28" rx="14" fill="rgba(197,168,128,0.1)" stroke="#C5A880" stroke-width="0.8" />
    <circle cx="16" cy="14" r="3.5" fill="#10B981" />
    <text x="28" y="18" fill="#DFBA73" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2">CAPABILITY DIRECTORY</text>
  </g>

  <!-- Title -->
  <text x="600" y="95" text-anchor="middle" fill="#FFFFFF" font-family="'Times New Roman', Georgia, serif" font-size="32">
    WHAT CAN THESE <tspan fill="url(#gold2)" font-style="italic">5,600+ SKILLS</tspan> DO?
  </text>
  <text x="600" y="122" text-anchor="middle" fill="rgba(255,255,255,0.55)" font-family="sans-serif" font-size="13" font-weight="300">
    Deterministic, production-grade autonomous capabilities across the modern stack
  </text>

  <!-- 6 Feature Cards Grid (2 rows of 3) -->

  <!-- ROW 1 -->
  <!-- Card 1: Autonomous Swarms -->
  <g transform="translate(60, 160)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="url(#gold2)" />
    <circle cx="35" cy="36" r="15" fill="rgba(197,168,128,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#DFBA73" font-family="monospace" font-size="14">⚡</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Autonomous Coding Swarms</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Parallel Agent Worktrees</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Dispatches isolated subagents</tspan>
      <tspan x="24" dy="15">in worktrees without merge conflicts.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Strict Test-Driven Loops</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Enforces red-green-refactor cycles</tspan>
      <tspan x="24" dy="15">to guarantee zero regressions.</tspan>
    </text>
    <text x="24" y="215" fill="#C5A880" font-family="monospace" font-size="10">skills: autonomous-loops, devfleet, tdd</text>
  </g>

  <!-- Card 2: Security & Tradecraft -->
  <g transform="translate(430, 160)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="#F43F5E" />
    <circle cx="35" cy="36" r="15" fill="rgba(244,63,94,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#F43F5E" font-family="monospace" font-size="14">🛡️</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Offensive &amp; Security Audits</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· 76 Rare Claude-Red Harnesses</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">EDR evasion, privesc research,</tspan>
      <tspan x="24" dy="15">and container escape tradecraft.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Defensive Nonce Hardening</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Audits CSP headers, token vaults,</tspan>
      <tspan x="24" dy="15">and remote execution boundaries.</tspan>
    </text>
    <text x="24" y="215" fill="#F43F5E" font-family="monospace" font-size="10">skills: claude-red, security-review</text>
  </g>

  <!-- Card 3: Systems & Native Desktop -->
  <g transform="translate(800, 160)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="#60A5FA" />
    <circle cx="35" cy="36" r="15" fill="rgba(59,130,246,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#60A5FA" font-family="monospace" font-size="14">💻</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Native Systems &amp; Runtimes</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Rust (Tokio) &amp; Tauri v2 Desktop</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Ultra-low latency desktop apps</tspan>
      <tspan x="24" dy="15">with native memory safety.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Win32 &amp; Hardware Video Codecs</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Direct GPU video playback pinned</tspan>
      <tspan x="24" dy="15">behind icons under 1% CPU usage.</tspan>
    </text>
    <text x="24" y="215" fill="#60A5FA" font-family="monospace" font-size="10">skills: rust-patterns, cpp-standards, tauri</text>
  </g>

  <!-- ROW 2 -->
  <!-- Card 4: 3D Luxury Web & Motion -->
  <g transform="translate(60, 425)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="#EAB308" />
    <circle cx="35" cy="36" r="15" fill="rgba(234,179,8,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#EAB308" font-family="monospace" font-size="14">✨</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Quiet Luxury &amp; 3D Motion</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· 3D Spatial Continuum &amp; GSAP</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Perspective tilts, gyro-tracking,</tspan>
      <tspan x="24" dy="15">and hardware shader depth tunnels.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Real-Time Web Audio DSP</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Dynamic audio spectrum analysis</tspan>
      <tspan x="24" dy="15">and zero-jitter visualizers.</tspan>
    </text>
    <text x="24" y="215" fill="#EAB308" font-family="monospace" font-size="10">skills: quiet-luxury, motion-primitives</text>
  </g>

  <!-- Card 5: Mobile & Device Automation -->
  <g transform="translate(430, 425)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="#10B981" />
    <circle cx="35" cy="36" r="15" fill="rgba(16,185,129,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#10B981" font-family="monospace" font-size="14">📱</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Mobile Engineering &amp; ADB</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· ARTEMIS Device Testing Loop</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Interactive closed-loop Android</tspan>
      <tspan x="24" dy="15">automation and gesture injection.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· Low-Latency Mirroring (Nova)</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Hardware H.264 stream decoding</tspan>
      <tspan x="24" dy="15">at 120 FPS over Wi-Fi TCP/IP.</tspan>
    </text>
    <text x="24" y="215" fill="#10B981" font-family="monospace" font-size="10">skills: android-clean-architecture, adb</text>
  </g>

  <!-- Card 6: Computational Science -->
  <g transform="translate(800, 425)">
    <rect width="340" height="235" rx="14" fill="url(#cardBg)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="340" height="3" rx="1.5" fill="#A855F7" />
    <circle cx="35" cy="36" r="15" fill="rgba(168,85,247,0.15)" />
    <text x="35" y="41" text-anchor="middle" fill="#A855F7" font-family="monospace" font-size="14">🔬</text>
    <text x="62" y="42" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Bioinformatics &amp; Science</text>
    
    <text x="24" y="80" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· ChEMBL, AlphaFold &amp; PDB</text>
    <text x="24" y="98" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Query bioactive targets and render</tspan>
      <tspan x="24" dy="15">interactive 3D molecular meshes.</tspan>
    </text>
    
    <text x="24" y="145" fill="#E2E8F0" font-family="sans-serif" font-size="12" font-weight="600">· ClinVar &amp; Genomic Pipeline</text>
    <text x="24" y="163" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="11">
      <tspan x="24" dy="0">Pathogenicity classification and</tspan>
      <tspan x="24" dy="15">tissue-specific RNA quantification.</tspan>
    </text>
    <text x="24" y="215" fill="#A855F7" font-family="monospace" font-size="10">skills: chembl, clinvar, pubchem, gtex</text>
  </g>
</svg>
