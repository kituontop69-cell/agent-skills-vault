<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#F3DC9D" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.015)" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Ambient light -->
  <circle cx="600" cy="80" r="140" fill="#C5A880" opacity="0.08" filter="url(#glow3)" />

  <!-- Header Badge -->
  <g transform="translate(480, 25)">
    <rect width="240" height="26" rx="13" fill="rgba(197,168,128,0.1)" stroke="#C5A880" stroke-width="0.8" />
    <circle cx="14" cy="13" r="3.5" fill="#3B82F6" />
    <text x="26" y="17" fill="#DFBA73" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2">EXECUTION LIFECYCLE</text>
  </g>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" fill="#FFFFFF" font-family="'Times New Roman', Georgia, serif" font-size="30">
    HOW AN AI AGENT <tspan fill="url(#gold3)" font-style="italic">EXECUTES A SKILL</tspan>
  </text>
  <text x="600" y="112" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="13" font-weight="300">
    Zero Token Bloat · Deterministic Stepwise Verification · Closed-Loop Delivery
  </text>

  <!-- Flow Steps (5 Steps) -->

  <!-- Step 1: User Goal -->
  <g transform="translate(50, 160)">
    <rect width="195" height="240" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#60A5FA" />
    <text x="18" y="32" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="600">STEP 01</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">User Goal</text>
    
    <text x="18" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      <tspan x="18" dy="0">Human partner issues</tspan>
      <tspan x="18" dy="16">high-level directive</tspan>
      <tspan x="18" dy="16">(e.g. TDD, C++ engine,</tspan>
      <tspan x="18" dy="16">or security audit).</tspan>
    </text>
    <rect x="18" y="185" width="159" height="32" rx="6" fill="rgba(96,165,250,0.1)" stroke="rgba(96,165,250,0.3)" />
    <text x="28" y="205" fill="#93C5FD" font-family="monospace" font-size="10">Intent Evaluated</text>
  </g>

  <!-- Step 2: Dynamic Skill Routing -->
  <g transform="translate(285, 160)">
    <rect width="195" height="240" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#DFBA73" />
    <text x="18" y="32" fill="#DFBA73" font-family="monospace" font-size="11" font-weight="600">STEP 02</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Dynamic Router</text>
    
    <text x="18" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      <tspan x="18" dy="0">Agent router scans</tspan>
      <tspan x="18" dy="16">5,600+ skills and</tspan>
      <tspan x="18" dy="16">loads ONLY matching</tspan>
      <tspan x="18" dy="16">SKILL.md contract.</tspan>
    </text>
    <rect x="18" y="185" width="159" height="32" rx="6" fill="rgba(223,186,115,0.1)" stroke="rgba(223,186,115,0.3)" />
    <text x="28" y="205" fill="#DFBA73" font-family="monospace" font-size="10">0 Token Waste</text>
  </g>

  <!-- Step 3: Strict Contract -->
  <g transform="translate(520, 160)">
    <rect width="195" height="240" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#F43F5E" />
    <text x="18" y="32" fill="#F43F5E" font-family="monospace" font-size="11" font-weight="600">STEP 03</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Strict Contract</text>
    
    <text x="18" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      <tspan x="18" dy="0">Agent ingests rules,</tspan>
      <tspan x="18" dy="16">environment bounds,</tspan>
      <tspan x="18" dy="16">required CLI tools,</tspan>
      <tspan x="18" dy="16">and safety criteria.</tspan>
    </text>
    <rect x="18" y="185" width="159" height="32" rx="6" fill="rgba(244,63,94,0.1)" stroke="rgba(244,63,94,0.3)" />
    <text x="28" y="205" fill="#F43F5E" font-family="monospace" font-size="10">Guaranteed Scope</text>
  </g>

  <!-- Step 4: Fast Action Bursts -->
  <g transform="translate(755, 160)">
    <rect width="195" height="240" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#EAB308" />
    <text x="18" y="32" fill="#EAB308" font-family="monospace" font-size="11" font-weight="600">STEP 04</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Fast Action Burst</text>
    
    <text x="18" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      <tspan x="18" dy="0">Executes actions in</tspan>
      <tspan x="18" dy="16">rapid bursts, beating</tspan>
      <tspan x="18" dy="16">turn latencies with</tspan>
      <tspan x="18" dy="16">in-flight auto-heal.</tspan>
    </text>
    <rect x="18" y="185" width="159" height="32" rx="6" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.3)" />
    <text x="28" y="205" fill="#EAB308" font-family="monospace" font-size="10">Sub-second Speed</text>
  </g>

  <!-- Step 5: Verification & Delivery -->
  <g transform="translate(990, 160)">
    <rect width="165" height="240" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="165" height="3" rx="1.5" fill="#10B981" />
    <text x="18" y="32" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">STEP 05</text>
    <text x="18" y="60" fill="#FFFFFF" font-family="sans-serif" font-size="15" font-weight="600">Verified Exit</text>
    
    <text x="18" y="92" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      <tspan x="18" dy="0">Read-only verifier</tspan>
      <tspan x="18" dy="16">audits tests, diffs,</tspan>
      <tspan x="18" dy="16">and evidence before</tspan>
      <tspan x="18" dy="16">handing to user.</tspan>
    </text>
    <rect x="18" y="185" width="129" height="32" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" />
    <text x="26" y="205" fill="#10B981" font-family="monospace" font-size="10">100% Tested</text>
  </g>
</svg>
