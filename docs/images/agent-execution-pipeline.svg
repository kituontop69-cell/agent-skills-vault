<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070709" />
      <stop offset="50%" stop-color="#0E0E14" />
      <stop offset="100%" stop-color="#070709" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C5A880" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#F3DC9D" />
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)" />
      <stop offset="100%" stop-color="rgba(255,255,255,0.015)" />
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="1200" height="480" fill="url(#bg3)" />

  <!-- Subtle grid lines -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="0.5">
    <line x1="0" y1="80" x2="1200" y2="80" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="400" x2="1200" y2="400" />
  </g>

  <!-- Ambient light -->
  <circle cx="600" cy="80" r="140" fill="#C5A880" opacity="0.08" filter="url(#glow3)" />

  <!-- Header Badge -->
  <g transform="translate(480, 25)">
    <rect width="240" height="26" rx="13" fill="rgba(197,168,128,0.1)" stroke="#C5A880" stroke-width="0.8" />
    <circle cx="14" cy="13" r="3.5" fill="#3B82F6" />
    <text x="26" y="17" fill="#DFBA73" font-family="monospace" font-size="10" font-weight="600" letter-spacing="2">EXECUTION LIFECYCLE</text>
  </g>

  <!-- Title -->
  <text x="600" y="85" text-anchor="middle" fill="#FFFFFF" font-family="'Times New Roman', Georgia, serif" font-size="32">
    HOW AN AI AGENT <tspan fill="url(#gold3)" font-style="italic">EXECUTES A SKILL</tspan>
  </text>
  <text x="600" y="112" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="sans-serif" font-size="13" font-weight="300">
    Zero Token Bloat · Deterministic Stepwise Verification · Closed-Loop Delivery
  </text>

  <!-- Flow Steps (5 Steps connected by arrows) -->

  <!-- Step 1: User Intent -->
  <g transform="translate(50, 160)">
    <rect width="195" height="230" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#60A5FA" />
    <text x="20" y="35" fill="#60A5FA" font-family="monospace" font-size="11" font-weight="600">STEP 01</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">User Goal</text>
    <text x="20" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11" line-height="1.5">
      Human or system issues high-level request (e.g. "Build RAT analysis module with strict TDD").
    </text>
    <rect x="20" y="170" width="155" height="35" rx="6" fill="rgba(96,165,250,0.1)" stroke="rgba(96,165,250,0.3)" />
    <text x="30" y="192" fill="#93C5FD" font-family="monospace" font-size="10">Intent Evaluated</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 255 275 L 275 275" stroke="#DFBA73" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="3,3" />

  <!-- Step 2: Dynamic Skill Routing -->
  <g transform="translate(285, 160)">
    <rect width="195" height="230" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#DFBA73" />
    <text x="20" y="35" fill="#DFBA73" font-family="monospace" font-size="11" font-weight="600">STEP 02</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Dynamic Router</text>
    <text x="20" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      astra_skills_router scans 5,000+ skills and loads ONLY the matching SKILL.md.
    </text>
    <rect x="20" y="170" width="155" height="35" rx="6" fill="rgba(223,186,115,0.1)" stroke="rgba(223,186,115,0.3)" />
    <text x="30" y="192" fill="#DFBA73" font-family="monospace" font-size="10">0 Token Waste</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 490 275 L 510 275" stroke="#DFBA73" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Step 3: Context & Guardrails -->
  <g transform="translate(520, 160)">
    <rect width="195" height="230" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#A855F7" />
    <text x="20" y="35" fill="#C084FC" font-family="monospace" font-size="11" font-weight="600">STEP 03</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Strict Contract</text>
    <text x="20" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      Skill activates guardrails: prerequisite verification, safety bounds, and phase goals.
    </text>
    <rect x="20" y="170" width="155" height="35" rx="6" fill="rgba(168,85,247,0.1)" stroke="rgba(168,85,247,0.3)" />
    <text x="30" y="192" fill="#C084FC" font-family="monospace" font-size="10">Guardrails Locked</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 725 275 L 745 275" stroke="#DFBA73" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Step 4: Stepwise Execution -->
  <g transform="translate(755, 160)">
    <rect width="195" height="230" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="195" height="3" rx="1.5" fill="#F59E0B" />
    <text x="20" y="35" fill="#FBBF24" font-family="monospace" font-size="11" font-weight="600">STEP 04</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Fast-Action Burst</text>
    <text x="20" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      Agent invokes tools, writes files, compiles code, and tests output in real-time sandbox.
    </text>
    <rect x="20" y="170" width="155" height="35" rx="6" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" />
    <text x="30" y="192" fill="#FBBF24" font-family="monospace" font-size="10">Evidence Recorded</text>
  </g>

  <!-- Arrow 4 -> 5 -->
  <path d="M 960 275 L 980 275" stroke="#DFBA73" stroke-width="2" stroke-dasharray="3,3" />

  <!-- Step 5: Verified Delivery -->
  <g transform="translate(990, 160)">
    <rect width="165" height="230" rx="14" fill="url(#cardGrad3)" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
    <rect width="165" height="3" rx="1.5" fill="#10B981" />
    <text x="18" y="35" fill="#10B981" font-family="monospace" font-size="11" font-weight="600">STEP 05</text>
    <text x="18" y="65" fill="#FFFFFF" font-family="sans-serif" font-size="16" font-weight="600">Final Gate</text>
    <text x="18" y="95" fill="rgba(255,255,255,0.6)" font-family="sans-serif" font-size="11">
      Exit verification confirms zero build errors before completing task.
    </text>
    <rect x="18" y="170" width="130" height="35" rx="6" fill="rgba(16,185,129,0.1)" stroke="rgba(16,185,129,0.3)" />
    <text x="28" y="192" fill="#34D399" font-family="monospace" font-size="10">✓ 100% Passing</text>
  </g>

  <!-- Footer -->
  <text x="600" y="440" text-anchor="middle" fill="rgba(255,255,255,0.3)" font-family="monospace" font-size="10" letter-spacing="1">
    AGENT SKILLS VAULT ARCHITECTURE · CURATED BY KITUB (@KITUONTOP69-CELL)
  </text>
</svg>
